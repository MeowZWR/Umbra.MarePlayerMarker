name: Publish
on:
  push:
    tags: ["*-cn", "*-ls"]

env:
  SOLUTION_NAME: Umbra.MarePlayerMarker
  RELEASE_DIR: out/Release

jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Determine build variant
        id: variant
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-ls ]]; then
            echo "ref=Lightless-unicode-support" >> "$GITHUB_OUTPUT"
            echo "version=${TAG%-ls}" >> "$GITHUB_OUTPUT"
            echo "body=This is the Lightless Sync version." >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG%-cn}" >> "$GITHUB_OUTPUT"
            echo "body=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.variant.outputs.ref }}
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Download Umbra Latest
        run: |
          Invoke-WebRequest -Uri https://github.com/goatcorp/PluginDistD17/raw/refs/heads/main/stable/Umbra/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\installedPlugins\Umbra\dist"

      - name: Restore solution
        run: dotnet restore -r win ${{ env.SOLUTION_NAME }}.sln

      - name: Build solution
        run: |
          $ver = '${{ steps.variant.outputs.version }}'
          dotnet restore -r win ${{ env.SOLUTION_NAME }}.sln
          dotnet build --configuration Release --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver

      - name: Create plugin archive
        run: Compress-Archive -Path ${{env.RELEASE_DIR}}* -DestinationPath ${{env.RELEASE_DIR}}/${{env.SOLUTION_NAME}}.zip

      - name: Publish Plugin
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.variant.outputs.body }}
          files: ${{env.RELEASE_DIR}}/${{env.SOLUTION_NAME}}.zip
